<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:transparent;
    font-family:'Cormorant Garamond',serif;
}

.timer-widget{
    width:300px;
    background:#f8f4f6;
    border:2px solid #efc6d8;
    border-radius:28px;
    padding:14px;

    text-align:center;

    box-shadow:
    0 0 25px rgba(239,198,216,.35),
    inset 0 0 0 6px rgba(255,240,245,.7);
}

.decor{
    color:#b88aa3;
    font-size:.9rem;
}

#timer{
    font-size:2rem;
    color:#8f647c;
    margin:10px 0;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
}

button{
    border:none;
    background:#e7b0c8;
    color:white;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:.8rem;
}

button:hover{
    background:#daa0ba;
}

.label{
    margin-top:10px;
    color:#b88aa3;
    font-size:.7rem;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="timer-widget">

    <div class="decor"> . ݁⋆ ۶ৎ ݁˖ . ݁</div>

    <div id="timer">25:00</div>

    <div class="buttons">
        <button onclick="startTimer()">start</button>
        <button onclick="pauseTimer()">pause</button>
        <button onclick="resetTimer()">reset</button>
    </div>

    <div class="label">♡ time spent now is free later ♡</div>

</div>

<script>
let duration = 25 * 60;
let currentTime = duration;
let interval = null;

function updateDisplay(){

    const minutes = Math.floor(currentTime / 60);
    const seconds = currentTime % 60;

    document.getElementById('timer').textContent =
    String(minutes).padStart(2,'0')
    + ':'
    + String(seconds).padStart(2,'0');
}

function startTimer(){

    if(interval) return;

    interval = setInterval(() => {

        if(currentTime > 0){

            currentTime--;
            updateDisplay();

        } else {

            clearInterval(interval);
            interval = null;

            alert('🩷 Pomodoro Complete!');
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);
    interval = null;
}

function resetTimer(){

    clearInterval(interval);
    interval = null;

    currentTime = duration;

    updateDisplay();
}

updateDisplay();
</script>

</body>
</html>
